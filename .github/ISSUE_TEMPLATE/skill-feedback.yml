name: Skill feedback
description: Report evidence from using an Agent Skill
title: "[Skill feedback] "
labels:
  - skill-feedback
body:
  - type: input
    id: skill
    attributes:
      label: Target Skill and version
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Remove secrets, personal data, private code, and private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction or evidence
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Correction or workaround
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, private source, and internal URLs.
          required: true
