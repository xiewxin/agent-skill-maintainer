name: Tooling bug
description: Report a reproducible failure in the maintainer tooling
title: "[Bug] "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Use fictional data and remove sensitive values.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Actual and expected result
    validations:
      required: true
