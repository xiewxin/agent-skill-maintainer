name: Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - "22"
          - "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - name: Run full tests
        if: runner.os != 'Windows'
        run: node --test tests/*.test.mjs
      - name: Run Windows-portable tests
        if: runner.os == 'Windows'
        # Signed-evaluator fixtures require POSIX owner-only mode proof.
        # Keep portable contracts plus an explicit fail-closed Windows check.
        run: node tests/run-windows-portable.mjs
      - name: Validate publication
        run: node scripts/validate-publication.mjs
      - name: Run contract evaluation
        run: node evals/run-evals.mjs --suite all
